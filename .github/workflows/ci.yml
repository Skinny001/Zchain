name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      zebra:
        image: zcash/zebra:latest
        ports:
          - 18232:18232
        env:
          ZEBRA_NETWORK: Regtest
        options: >-
          --health-cmd "curl -f http://localhost:18232/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests against Zebra Regtest
        env:
          RPC_HOST: 127.0.0.1
          RPC_PORT: 18232
          RPC_USER: zcashuser
          RPC_PASSWORD: zcashpassword
        run: |
          pytest
          python zchain.py height