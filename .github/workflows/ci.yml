name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Create Zebra regtest config
        run: |
          mkdir -p zebra_config
          cat << 'EOF' > zebra_config/zebra.toml
          [network]
          network = "Regtest"

          [rpc]
          listen_addr = "0.0.0.0:18232"
          enable_cookie_auth = false

          [zcashd_compat]
          enabled = true
          EOF

      - name: Start Zebra Regtest Node
        run: |
          docker run -d \
            --name zebra \
            -p 18232:18232 \
            -v $(pwd)/zebra_config/zebra.toml:/etc/zebra/zebra.toml \
            zfnd/zebra:latest zebrad -c /etc/zebra/zebra.toml start

      - name: Wait for Zebra RPC readiness
        run: |
          echo "Waiting for Zebra RPC..."
          for i in {1..30}; do
            if curl -s -d '{"jsonrpc":"1.0","id":"curltext","method":"getblockcount","params":[]}' -H 'content-type: application/json' http://127.0.0.1:18232/ > /dev/null; then
              echo "Zebra RPC is ready!"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Zebra failed to start within timeout"
          docker logs zebra
          exit 1

      - name: Run tests against Zebra Regtest
        env:
          RPC_HOST: 127.0.0.1
          RPC_PORT: 18232
        run: |
          pytest
          python zchain.py height